name: Hourly AQI Data Fetch

on:
  schedule:
    - cron: "0 * * * *" # cron expression (Minute Hour Day Month Weekday)
  workflow_dispatch: # add btn by which can run pipline whenever we want

jobs:
  fetch:
    runs-on: ubuntu-latest # Create fresh comp for workflow (use ubuntu linux)
    steps:
      - name: Checkout repository # download my project from github
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python src/live_pipeline.py
